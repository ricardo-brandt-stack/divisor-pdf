<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisor de PDF (Máx 11MB) - Local & Seguro</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- pdf-lib para manipulação avançada de PDFs no cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>

    <div class="app-card">
        <!-- CABEÇALHO COM BOTÃO DARK MODE -->
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <span class="brand-icon">✂️</span>
                    <div>
                        <h1>Divisor de PDF por Tamanho</h1>
                        <p>Divida PDFs em partes de no máximo 11 MB automaticamente</p>
                    </div>
                </div>
                <button id="theme-toggle" class="theme-btn" aria-label="Alternar Tema">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <main class="app-main">
            <!-- PAINEL 1: UPLOAD -->
            <section class="panel">
                <h2 class="panel-title">1. Selecionar Arquivo PDF</h2>
                <div class="upload-zone" id="drop-zone">
                    <input type="file" id="file-input" accept=".pdf">
                    <label for="file-input" class="upload-label">
                        <span class="upload-icon">📄</span>
                        <div class="upload-text">
                            <strong id="upload-status">Clique para selecionar ou arraste um PDF longo</strong>
                            <span>Máximo de 11 MB por parte gerada</span>
                        </div>
                    </label>
                </div>
            </section>

            <!-- PAINEL 2: DETALHES DO ARQUIVO SELECIONADO -->
            <section class="panel hidden" id="file-info-panel">
                <h2 class="panel-title">2. Informações do PDF</h2>
                <div class="info-grid">
                    <div><strong>Nome:</strong> <span id="info-name">-</span></div>
                    <div><strong>Tamanho Total:</strong> <span id="info-size">-</span></div>
                </div>
            </section>

            <!-- BARRA DE PROGRESSO -->
            <div class="progress-container hidden" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
                <span class="progress-text" id="progress-text">0%</span>
            </div>

            <!-- AÇÃO PRINCIPAL -->
            <div class="action-bar">
                <button id="split-btn" class="btn btn-primary" disabled>
                    <span>✂️</span> Dividir PDF em Partes (Máx 11 MB)
                </button>
            </div>

            <!-- PAINEL 3: RESULTADOS E DOWNLOADS -->
            <section class="panel hidden" id="results-panel">
                <h2 class="panel-title">3. Partes Geradas para Download</h2>
                <ul class="parts-list" id="parts-list"></ul>
            </section>
        </main>

        <footer class="app-footer">
            <p>🔒 Processamento 100% Client-Side. Seus documentos não saem do seu navegador.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
